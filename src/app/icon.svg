<!-- MNmedias mærke som faneikon. Samme geometri som Logo.tsx: ændrer du
     stregmål eller punkter dér, skal denne fil rettes med.
     Hvid streg på sitets sorte bund — mærket har ingen lys variant med
     baggrund, fordi fanelinjen selv kan være både lys og mørk. -->
